{% extends "base.html" %}

{% block title %}Login | Learning Ops Hub{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-3">Sign in</h1>
          <p class="text-secondary mb-4">Enter your password to access your private hub.</p>

          {% if error %}
            <div class="alert alert-danger" role="alert">
              {{ error }}
            </div>
          {% endif %}

          <form method="post" action="{{ url_for('login') }}">
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                required
                autofocus
              />
            </div>

            <button type="submit" class="btn btn-primary w-100">
              Login
            </button>
          </form>

          <div class="mt-3 text-center">
            <a class="link-secondary" href="{{ url_for('home') }}">Back to home</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
