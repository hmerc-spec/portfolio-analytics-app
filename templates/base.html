<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Learning Ops Hub{% endblock %}</title>

    <!-- Bootstrap CSS (CDN) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>

  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <div class="d-flex align-items-center gap-2">
          {% if session.get("logged_in") %}
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="offcanvas"
              data-bs-target="#navOffcanvas"
              aria-controls="navOffcanvas"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
          {% endif %}

          <a class="navbar-brand mb-0" href="{{ url_for('home') }}">Learning Ops Hub</a>
        </div>

        <div class="ms-auto d-flex">
          {% if session.get("logged_in") %}
            <a class="btn btn-warning btn-sm" href="{{ url_for('logout') }}">Logout</a>
          {% else %}
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('login') }}">Login</a>
          {% endif %}
        </div>
      </div>
    </nav>

    {% if session.get("logged_in") %}
      <div
        class="offcanvas offcanvas-start text-bg-dark"
        tabindex="-1"
        id="navOffcanvas"
        aria-labelledby="navOffcanvasLabel"
      >
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="navOffcanvasLabel">Navigation</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
          <div class="nav flex-column">
            <a
              class="nav-link text-white {% if request.path.startswith('/dashboard') %}active{% endif %}"
              href="{{ url_for('dashboard') }}"
              {% if request.path.startswith('/dashboard') %}aria-current="page"{% endif %}
            >Dashboard</a>

            <a
              class="nav-link text-white {% if request.path.startswith('/projects') %}active{% endif %}"
              href="{{ url_for('projects_list') }}"
              {% if request.path.startswith('/projects') %}aria-current="page"{% endif %}
            >Projects</a>

            <a
              class="nav-link text-white {% if request.path.startswith('/features') %}active{% endif %}"
              href="{{ url_for('features_list') }}"
              {% if request.path.startswith('/features') %}aria-current="page"{% endif %}
            >Features</a>

            <a
              class="nav-link text-white {% if request.path.startswith('/bugs') %}active{% endif %}"
              href="{{ url_for('bugs_list') }}"
              {% if request.path.startswith('/bugs') %}aria-current="page"{% endif %}
            >Bugs</a>

            <a
              class="nav-link text-white {% if request.path.startswith('/learning') %}active{% endif %}"
              href="{{ url_for('learning_list') }}"
              {% if request.path.startswith('/learning') %}aria-current="page"{% endif %}
            >Learning</a>
          </div>
        </div>
      </div>
    {% endif %}


    <main class="container py-5">
      {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS (optional) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
