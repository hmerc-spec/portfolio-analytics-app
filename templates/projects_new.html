{% extends "base.html" %}

{% block title %}New Project | Learning Ops Hub{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">New Project</h1>
        <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('projects_list') }}">Back</a>
      </div>

      {% if errors %}
        <div class="alert alert-danger" role="alert">
          <ul class="mb-0">
            {% for e in errors %}
              <li>{{ e }}</li>
            {% endfor %}
          </ul>
        </div>
      {% endif %}

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <form method="post" action="{{ url_for('projects_new') }}">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label" for="name">Project name *</label>
                <input
                  type="text"
                  class="form-control"
                  id="name"
                  name="name"
                  required
                  value="{{ form.get('name', '') }}"
                  placeholder="e.g., Sales KPI Dashboard for Small Teams"
                />
              </div>

              <div class="col-12">
                <label class="form-label" for="problem_statement">Problem statement *</label>
                <textarea
                  class="form-control"
                  id="problem_statement"
                  name="problem_statement"
                  rows="4"
                  required
                  placeholder="What real-life problem does this solve?"
                >{{ form.get('problem_statement', '') }}</textarea>
              </div>

              <div class="col-12 col-md-4">
                <label class="form-label" for="status">Status</label>
                <select class="form-select" id="status" name="status">
                  {% set current = form.get('status', 'idea') %}
                  <option value="idea" {% if current == 'idea' %}selected{% endif %}>idea</option>
                  <option value="planned" {% if current == 'planned' %}selected{% endif %}>planned</option>
                  <option value="in_progress" {% if current == 'in_progress' %}selected{% endif %}>in_progress</option>
                  <option value="paused" {% if current == 'paused' %}selected{% endif %}>paused</option>
                  <option value="done" {% if current == 'done' %}selected{% endif %}>done</option>
                </select>
              </div>

              <div class="col-12 col-md-8">
                <label class="form-label" for="tags">Tags</label>
                <input
                  type="text"
                  class="form-control"
                  id="tags"
                  name="tags"
                  value="{{ form.get('tags', '') }}"
                  placeholder="analytics, flask, sql, dashboard"
                />
              </div>

              <div class="col-12">
                <label class="form-label" for="notes">Notes</label>
                <textarea
                  class="form-control"
                  id="notes"
                  name="notes"
                  rows="5"
                  placeholder="Extra thoughts, links, requirements..."
                >{{ form.get('notes', '') }}</textarea>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
              <a class="btn btn-outline-secondary" href="{{ url_for('projects_list') }}">Cancel</a>
              <button type="submit" class="btn btn-primary">Save Project</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
