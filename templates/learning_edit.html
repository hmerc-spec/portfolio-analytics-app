{% extends "base.html" %}

{% block title %}Edit Learning Entry | Learning Ops Hub{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Edit Learning Entry</h1>
        <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('learning_detail', entry_id=entry_id) }}">Back</a>
      </div>

      {% if errors %}
        <div class="alert alert-danger" role="alert">
          <ul class="mb-0">
            {% for e in errors %}
              <li>{{ e }}</li>
            {% endfor %}
          </ul>
        </div>
      {% endif %}

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <form method="post" action="{{ url_for('learning_edit', entry_id=entry_id) }}">
            <div class="row g-3">
              <div class="col-12 col-md-4">
                <label class="form-label" for="entry_date">Date</label>
                <input
                  type="date"
                  class="form-control"
                  id="entry_date"
                  name="entry_date"
                  value="{{ form.get('entry_date', '') }}"
                />
              </div>

              <div class="col-12 col-md-8">
                <label class="form-label" for="topic">Topic *</label>
                <input
                  type="text"
                  class="form-control"
                  id="topic"
                  name="topic"
                  required
                  value="{{ form.get('topic', '') }}"
                />
              </div>

              <div class="col-12 col-md-4">
                <label class="form-label" for="minutes">Minutes *</label>
                <input
                  type="number"
                  class="form-control"
                  id="minutes"
                  name="minutes"
                  required
                  min="0"
                  value="{{ form.get('minutes', '') }}"
                />
              </div>

              <div class="col-12 col-md-4">
                <label class="form-label" for="confidence">Confidence (1–5) *</label>
                <input
                  type="number"
                  class="form-control"
                  id="confidence"
                  name="confidence"
                  required
                  min="1"
                  max="5"
                  value="{{ form.get('confidence', '') }}"
                />
              </div>

              <div class="col-12 col-md-4">
                <label class="form-label" for="tags">Tags</label>
                <input
                  type="text"
                  class="form-control"
                  id="tags"
                  name="tags"
                  value="{{ form.get('tags', '') }}"
                />
              </div>

              <div class="col-12">
                <label class="form-label" for="summary">Summary</label>
                <input
                  type="text"
                  class="form-control"
                  id="summary"
                  name="summary"
                  value="{{ form.get('summary', '') }}"
                />
              </div>

              <div class="col-12">
                <label class="form-label" for="notes">Notes</label>
                <textarea
                  class="form-control"
                  id="notes"
                  name="notes"
                  rows="6"
                >{{ form.get('notes', '') }}</textarea>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
              <a class="btn btn-outline-secondary" href="{{ url_for('learning_detail', entry_id=entry_id) }}">Cancel</a>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
